name: Probe site download
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in downloads/releases/v2.0.0/SHA256SUMS downloads/releases/v2.0.0/fluxgate-v2.0.0-linux-x86_64.tar.gz downloads/code-refs/fluxgate-code-refs.github.yml downloads/docker-compose.demo.yml docs/; do
            code=$(curl -sS -o body -w '%{http_code}' "https://flux.forgeopslabs.com/$p"); echo "$code /$p $(head -c 40 body | tr -dc '[:print:]')"
          done
